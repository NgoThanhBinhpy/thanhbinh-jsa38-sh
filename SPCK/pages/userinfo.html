<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông tin người dùng</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../static/css/model.css" />
  </head>
  <body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Nav-bar starts-->
    <script src="../static/js/navbarCreator.js"></script>
    <!-- Nav-bar end-->

    <!--Text container starts-->
    <div class="container mt-4 table-responsive">
      <h1 class="text-center mb-4">Thông tin người dùng</h1>
      <p class="text-center mb-4">
        Đây là nơi bạn xem và quản lý các thông tin cá nhân của mình, giúp trải
        nghiệm học tập trở nên thuận tiện và cá nhân hóa hơn.
      </p>
    </div>
    <!--Text container ends-->

    <!--userinfo-table-content starts-->
    <div class="container mt-4 table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th class="text-center col-4" scope="col">Mục</th>
            <th class="text-center col-8" scope="col">Thông tin</th>
          </tr>
        </thead>
        <tbody class="table-group-divider">
          <tr>
            <th class="text-center" scope="row">Tên đăng nhập</th>
            <td class="text-center" id="usernameCell"></td>
          </tr>
          <tr>
            <th class="text-center" scope="row">Email</th>
            <td class="text-center" id="emailCell"></td>
          </tr>
          <tr>
            <th class="text-center" scope="row">Số điện thoại</th>
            <td class="text-center" id="phoneCell"></td>
          </tr>
          <tr>
            <th class="text-center" scope="row">Giới tính</th>
            <td class="text-center" id="genderCell"></td>
          </tr>
          <tr>
            <th class="text-center" scope="row">Ngày sinh</th>
            <td class="text-center" id="dobCell"></td>
          </tr>
          <tr>
            <th class="text-center" scope="row">Địa chỉ</th>
            <td class="text-center" id="addressCell"></td>
          </tr>
          <tr>
            <th class="text-center" scope="row">Tỉnh/Thành</th>
            <td class="text-center" id="stateCell"></td>
          </tr>
        </tbody>
      </table>
      <div class="mx-auto col-4">
        <button
          class="btn btn-info container-fluid mx-auto"
          onclick="
            localStorage.setItem('Username', '');
            window.location.href = './signin.html';
          "
        >
          Đăng xuất & Đăng nhập
        </button>
      </div>
    </div>
    <!--userinfo-table-content ends-->

    <script src="../static/js/userinfo.js"></script>
    <script src="../static/js/checkLoginStatus.js" type="module"></script>
  </body>
</html>

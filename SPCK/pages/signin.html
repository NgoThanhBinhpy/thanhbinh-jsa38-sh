<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.css"
      integrity="sha512-NhLySQDkiKSKnT+R795uaHWRQ7D3VuIvgeOLCK8cWq4w5fq4sWF90gj8eURpTqn/f1mFzqClpOz8JPlgVTLfFw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../static/css/model.css" />
  </head>
  <body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.js"
      integrity="sha512-aK6kibiwf8qo6euZqFOsx3sZ0WmEYs3f/wtvp44qy8CdGcTah45mgbOsLi5RMvylljL0TTMu6Shr6X+g1w1lIA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- Toast Success starts-->
    <div
      id="toastSuccess"
      class="toast align-items-center text-bg-success border-0 position-fixed top-0 start-50 translate-middle-x mt-3 z-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body" id="toastSuccessBody">Thành công!</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
        ></button>
      </div>
    </div>
    <!-- Toast Success ends-->

    <!-- Toast Danger starts-->
    <div
      id="toastDanger"
      class="toast align-items-center text-bg-danger border-0 position-fixed top-0 start-50 translate-middle-x mt-3 z-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body" id="toastDangerBody">Có lỗi xảy ra!</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
        ></button>
      </div>
    </div>
    <!--Toast Danger ends-->

    <!--Signin-form-content starts-->
    <div class="m-4">
      <form
        class="row g-3 needs-validation d-flex flex-column align-items-center"
        id="formSignin"
        novalidate=""
      >
        <!--Username-input starts-->
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-user text-secondary"></i>
            </span>
            <div class="form-floating flex-grow-1">
              <input
                type="text"
                class="form-control"
                id="inputName"
                placeholder="Tên đăng nhập"
                required=""
              />
              <label for="inputName">Tên đăng nhập</label>
            </div>
          </div>
          <div class="invalid-feedback">Vui lòng nhập tên đăng nhập.</div>
        </div>
        <!--Username-input ends-->

        <!--Password-input starts-->
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-lock text-secondary"></i>
            </span>
            <div class="form-floating flex-grow-1">
              <input
                type="password"
                class="form-control"
                id="inputPassword"
                placeholder="Mật khẩu"
                required=""
              />
              <label for="inputPassword">Mật khẩu</label>
            </div>
          </div>
          <div class="invalid-feedback">Vui lòng nhập mật khẩu.</div>
        </div>
        <!--Password-input starts-->

        <!--PasswordConfirm-input starts-->
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-lock text-secondary"></i>
            </span>
            <div class="form-floating flex-grow-1">
              <input
                type="password"
                class="form-control"
                id="inputPasswordConfirm"
                placeholder="Nhập lại mật khẩu"
                required=""
              />
              <label for="inputPasswordConfirm">Nhập lại mật khẩu</label>
            </div>
          </div>
          <div class="invalid-feedback">Vui lòng nhập lại mật khẩu khớp.</div>
        </div>
        <!--PasswordConfirm-input ends-->

        <!--Grid-check-input starts-->
        <div class="col-5">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck" />
            <label class="form-check-label" for="gridCheck">
              Giữ đăng nhập
            </label>
          </div>
        </div>
        <!--Grid-check-input ends-->

        <!--Sunmit-button starts-->
        <div class="d-grid gap-2 col-md-6 col-sm-10">
          <button class="btn btn-outline-primary" type="submit">
            Đăng nhập
          </button>
        </div>
        <!--Sunmit-button ends-->

        <!--Register-link starts-->
        <div class="text-center">
          <a href="./register.html" class="text-decoration-none">
            Chưa có tài khoản? Đăng kí ngay!
          </a>
        </div>
        <!--Register-link ends-->
      </form>
    </div>
    <!--Signin-form-content ends-->

    <script src="../static/js/signin.js" type="module"></script>
  </body>
</html>

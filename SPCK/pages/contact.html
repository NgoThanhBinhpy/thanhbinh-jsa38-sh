<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liên hệ</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../static/css/model.css" />
  </head>
  <body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- Toast Success starts-->
    <div
      id="toastSuccess"
      class="toast align-items-center text-bg-success border-0 position-fixed top-0 start-50 translate-middle-x mt-3 z-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body" id="toastSuccessBody">Thành công!</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
        ></button>
      </div>
    </div>
    <!-- Toast Success ends-->

    <!-- Toast Danger starts-->
    <div
      id="toastDanger"
      class="toast align-items-center text-bg-danger border-0 position-fixed top-0 start-50 translate-middle-x mt-3 z-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body" id="toastDangerBody">Có lỗi xảy ra!</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
        ></button>
      </div>
    </div>
    <!--Toast Danger ends-->

    <!-- Nav-bar starts-->
    <script src="../static/js/navbarCreator.js"></script>
    <!-- Nav-bar end-->

    <!--Text container starts-->
    <div class="container mt-4">
      <h1 class="text-center mb-4">Liên hệ</h1>
      <p class="text-center mb-4">
        Trang Liên hệ giúp học sinh và phụ huynh gửi thắc mắc, góp ý hoặc yêu
        cầu hỗ trợ. Nhà trường luôn sẵn sàng lắng nghe và phản hồi trong thời
        gian sớm nhất.
      </p>
    </div>
    <!--Text container ends-->

    <!--Contact-content starts-->
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div
          id="content-container"
          class="col-xl-6 col-lg-7 col-md-8 col-sm-12"
        >
          <form class="border p-4 rounded" id="formContact" novalidate="">
            <!--Username-input starts-->
            <div class="mb-3">
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fa-solid fa-user text-secondary"></i>
                </span>
                <div class="form-floating flex-grow-1">
                  <input
                    type="text"
                    id="inputName"
                    name="name"
                    class="form-control"
                    placeholder="Họ và tên"
                    required=""
                  />
                  <label for="inputName">Họ và tên</label>
                </div>
              </div>
              <div class="invalid-feedback">
                Vui lòng nhập họ và tên của bạn.
              </div>
            </div>
            <!--Username-input ends-->

            <!--Email-input starts-->
            <div class="mb-3">
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fa-solid fa-envelope text-secondary"></i>
                </span>
                <div class="form-floating flex-grow-1">
                  <input
                    type="email"
                    id="inputEmail"
                    name="email"
                    class="form-control"
                    placeholder="Email"
                    required=""
                  />
                  <label for="inputEmail">Email</label>
                </div>
              </div>
              <div class="invalid-feedback">Vui lòng nhập email của bạn.</div>
            </div>
            <!--Email-input ends-->

            <!--Message-input starts-->
            <div class="mb-3">
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fa-solid fa-comment text-secondary"></i>
                </span>
                <div class="form-floating flex-grow-1">
                  <textarea
                    id="inputMessage"
                    name="message"
                    placeholder="Nhập nội dung liên hệ..."
                    class="form-control"
                    required=""
                  ></textarea>
                  <label for="inputMessage">Nhập nội dung liên hệ...</label>
                </div>
              </div>
              <div class="invalid-feedback">
                Vui lòng nhập nội dung liên hệ.
              </div>
            </div>
            <!--Message-input ends-->

            <br />

            <!--Submit button starts-->
            <div class="d-grid gap-2 col-6 mx-auto text-center">
              <button type="submit" class="btn btn-info">Gửi</button>
            </div>
            <!--Submit button ends-->
          </form>
        </div>
      </div>
    </div>
    <!--Contact-content ends-->
    <script src="../static/js/contact.js" type="module"></script>
    <!-- <script src="../static/js/contact-responsive.js"></script> -->
    <script src="../static/js/checkLoginStatus.js" type="module"></script>
  </body>
</html>

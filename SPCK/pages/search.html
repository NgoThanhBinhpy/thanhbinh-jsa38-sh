<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../static/css/index.css" />
  </head>
  <body class="pt-2">
    <div class="px-4 py-3">
      <h2 id="games_title"></h2>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="results-count" class="text-muted fs-6"></span>
        <select class="form-select w-auto" id="sort-select">
          <option value="-added" selected>Most Popular</option>
          <option value="-metacritic">Top Rated</option>
          <option value="-rating">Highest Rated</option>
          <option value="-released">Newest</option>
          <option value="name">A-Z</option>
        </select>
      </div>
      <div class="games-grid" id="games_list">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <div class="text-center mt-4">
        <button class="btn btn-outline-secondary px-5" id="load-more-btn">
          Load More
        </button>
      </div>
    </div>
    <script src="../static/js/utils.js" type="module"></script>
    <script src="../static/js/search.js" type="module"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Collection</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/css/index.css" />
  </head>
  <body class="pt-2">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <div
      id="toast-container"
      class="position-fixed top-0 start-50 translate-middle-x mt-3 d-flex flex-column gap-2"
      style="z-index: 1056"
    ></div>

    <div class="px-4 py-3">
      <h2 class="mb-3">
        <i class="fa-solid fa-layer-group me-2"></i>My Collection
      </h2>
      <ul class="nav nav-tabs mb-3" id="collectionTab">
        <li class="nav-item">
          <a class="nav-link active" data-bs-toggle="tab" href="#wishlist">
            <i class="fa-solid fa-bookmark me-1"></i> Wishlist
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="tab" href="#favourites">
            <i class="fa-solid fa-heart me-1"></i> Favourites
          </a>
        </li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="wishlist">
          <div class="games-grid" id="wishlist-grid"></div>
        </div>
        <div class="tab-pane fade" id="favourites">
          <div class="games-grid" id="favourites-grid"></div>
        </div>
      </div>
    </div>

    <script src="../static/js/utils.js" type="module"></script>
    <script src="../static/js/collection.js" type="module"></script>
  </body>
</html>

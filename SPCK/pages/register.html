<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.css"
      integrity="sha512-NhLySQDkiKSKnT+R795uaHWRQ7D3VuIvgeOLCK8cWq4w5fq4sWF90gj8eURpTqn/f1mFzqClpOz8JPlgVTLfFw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../static/css/model.css" />
  </head>
  <body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"
      integrity="sha512-K/oyQtMXpxI4+K0W7H25UopjM8pzq0yrVdFdG21Fh5dBe91I40pDd9A4lzNlHPHBIP2cwZuoxaUSX0GJSObvGA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.js"
      integrity="sha512-aK6kibiwf8qo6euZqFOsx3sZ0WmEYs3f/wtvp44qy8CdGcTah45mgbOsLi5RMvylljL0TTMu6Shr6X+g1w1lIA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- Toast Success starts-->
    <div
      id="toastSuccess"
      class="toast align-items-center text-bg-success border-0 position-fixed top-0 start-50 translate-middle-x mt-3 z-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body" id="toastSuccessBody">Thành công!</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
        ></button>
      </div>
    </div>
    <!-- Toast Success ends-->

    <!-- Toast Danger starts-->
    <div
      id="toastDanger"
      class="toast align-items-center text-bg-danger border-0 position-fixed top-0 start-50 translate-middle-x mt-3 z-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body" id="toastDangerBody">Có lỗi xảy ra!</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
        ></button>
      </div>
    </div>
    <!--Toast Danger ends-->

    <!--Register-form-content starts-->
    <div class="m-4">
      <form class="row g-3 needs-validation" id="formRegister" novalidate="">
        <!--Username-input starts-->
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-user text-secondary"></i>
            </span>

            <div class="form-floating flex-grow-1">
              <input
                type="text"
                class="form-control"
                id="inputName"
                placeholder="Tên đăng nhập"
                required=""
              />
              <label for="inputName">Tên đăng nhập</label>
            </div>
          </div>

          <div class="invalid-feedback">Vui lòng nhập tên đăng nhập.</div>
        </div>
        <!--Username-input ends-->

        <!--Email-input starts-->
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-envelope text-secondary"></i>
            </span>

            <div class="form-floating flex-grow-1">
              <input
                type="email"
                class="form-control"
                id="inputEmail"
                placeholder="Email"
                required=""
              />
              <label for="inputEmail">Email</label>
            </div>
          </div>
        </div>
        <!--Email-input ends-->

        <!--Password-input starts-->
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-lock text-secondary"></i>
            </span>

            <div class="form-floating flex-grow-1">
              <input
                type="password"
                class="form-control"
                id="inputPassword"
                placeholder="Mật khẩu"
                required=""
              />
              <label for="inputPassword">Mật khẩu</label>
            </div>
          </div>
        </div>
        <!--Password-input ends-->

        <!--Gender-input starts-->
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-venus-mars text-secondary"></i>
            </span>
            <div class="form-floating flex-grow-1">
              <select class="form-select" id="inputGender" required="">
                <option value="" disabled selected>Chọn giới tính...</option>
                <option>Nam</option>
                <option>Nữ</option>
                <option>Khác...</option>
              </select>
              <label for="inputGender">Giới tính</label>
            </div>
          </div>
          <div class="invalid-feedback">Vui lòng chọn giới tính.</div>
        </div>
        <!--Gender-input ends-->

        <!--PhoneNum-input starts-->
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-phone text-secondary"></i>
            </span>
            <div class="form-floating flex-grow-1">
              <input
                type="text"
                class="form-control"
                id="inputPhone"
                placeholder="0123456789"
                required=""
              />
              <label for="inputPhone">Số điện thoại</label>
            </div>
          </div>
          <div class="invalid-feedback">Vui lòng nhập số điện thoại.</div>
        </div>
        <!--PhoneNum-input ends-->

        <!--DOB-input starts-->
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-calendar-days text-secondary"></i>
            </span>
            <div class="form-floating flex-grow-1">
              <input
                type="text"
                class="form-control"
                id="inputDOB"
                placeholder="dd/mm/yyyy"
                required=""
              />
              <label for="inputDOB">Ngày sinh</label>
            </div>
          </div>
          <div class="invalid-feedback">Vui lòng nhập ngày sinh.</div>
        </div>
        <!--DOB-input ends-->

        <!--Address-input starts-->
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-location-dot text-secondary"></i>
            </span>
            <div class="form-floating flex-grow-1">
              <input
                type="text"
                class="form-control"
                id="inputAddress"
                placeholder="Địa chỉ"
                required=""
              />
              <label for="inputAddress">Địa chỉ</label>
            </div>
          </div>
          <div class="invalid-feedback">Vui lòng nhập địa chỉ.</div>
        </div>
        <!--Address-input ends-->

        <!--State-input starts-->
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-map text-secondary"></i>
            </span>
            <div class="form-floating flex-grow-1">
              <select class="form-select" id="inputState" required="">
                <option value="" disabled selected>Chọn Tỉnh/Thành...</option>
                <option>An Giang</option>
                <option>Bà Rịa - Vũng Tàu</option>
                <option>Bạc Liêu</option>
                <option>Bắc Giang</option>
                <option>Bắc Kạn</option>
                <option>Bắc Ninh</option>
                <option>Bến Tre</option>
                <option>Bình Dương</option>
                <option>Bình Định</option>
                <option>Bình Phước</option>
                <option>Bình Thuận</option>
                <option>Cà Mau</option>
                <option>Cần Thơ</option>
                <option>Cao Bằng</option>
                <option>Đà Nẵng</option>
                <option>Đắk Lắk</option>
                <option>Đắk Nông</option>
                <option>Điện Biên</option>
                <option>Đồng Nai</option>
                <option>Đồng Tháp</option>
                <option>Gia Lai</option>
                <option>Hà Giang</option>
                <option>Hà Nam</option>
                <option>Hà Nội</option>
                <option>Hà Tĩnh</option>
                <option>Hải Dương</option>
                <option>Hải Phòng</option>
                <option>Hậu Giang</option>
                <option>Hòa Bình</option>
                <option>Hưng Yên</option>
                <option>Khánh Hòa</option>
                <option>Kiên Giang</option>
                <option>Kon Tum</option>
                <option>Lai Châu</option>
                <option>Lâm Đồng</option>
                <option>Lạng Sơn</option>
                <option>Lào Cai</option>
                <option>Long An</option>
                <option>Nam Định</option>
                <option>Nghệ An</option>
                <option>Ninh Bình</option>
                <option>Ninh Thuận</option>
                <option>Phú Thọ</option>
                <option>Phú Yên</option>
                <option>Quảng Bình</option>
                <option>Quảng Nam</option>
                <option>Quảng Ngãi</option>
                <option>Quảng Ninh</option>
                <option>Quảng Trị</option>
                <option>Sóc Trăng</option>
                <option>Sơn La</option>
                <option>Tây Ninh</option>
                <option>Thái Bình</option>
                <option>Thái Nguyên</option>
                <option>Thanh Hóa</option>
                <option>Thừa Thiên Huế</option>
                <option>Tiền Giang</option>
                <option>TP Hồ Chí Minh</option>
                <option>Trà Vinh</option>
                <option>Tuyên Quang</option>
                <option>Vĩnh Long</option>
                <option>Vĩnh Phúc</option>
                <option>Yên Bái</option>
              </select>
              <label for="inputState">Tỉnh/Thành</label>
            </div>
          </div>
          <div class="invalid-feedback">Vui lòng chọn Tỉnh/Thành.</div>
        </div>
        <!--State-input ends-->

        <!--Grid-check-input starts-->
        <div class="col-12">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="gridCheck"
              required=""
            />
            <label class="form-check-label" for="gridCheck">
              Tôi đồng ý với điều khoản sử dụng
            </label>
          </div>
        </div>
        <!--Grid-check-input ends-->

        <!--Submit-button starts-->
        <div class="d-grid gap-2 col-6 mx-auto">
          <button type="submit" class="btn btn-outline-primary">Đăng ký</button>
        </div>
        <!--Submit-button ends-->

        <!--Signin-link starts-->
        <div class="text-center">
          <a href="./signin.html" class="text-decoration-none">
            Đã có tài khoản? Đăng nhập ngay
          </a>
        </div>
        <!--Signin-link ends-->
      </form>
    </div>
    <!--Register-form-content ends-->

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../static/js/register.js" type="module"></script>
  </body>
</html>

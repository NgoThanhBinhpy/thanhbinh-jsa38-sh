<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký</title>
  </head>
  <body>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <div class="m-4 col-md-10 mx-auto">
      <h2 class="text-center mb-4 text-secondary-emphasis">
        Đăng ký tài khoản
      </h2>
      <form class="row g-3 needs-validation" id="formRegister" novalidate="">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-user text-secondary"></i>
            </span>

            <div class="form-floating flex-grow-1">
              <input
                type="text"
                class="form-control"
                id="inputName"
                placeholder="Tên đăng nhập"
                required=""
              />
              <label for="inputName">Tên đăng nhập</label>
            </div>
          </div>

          <div class="invalid-feedback">Vui lòng nhập tên đăng nhập.</div>
        </div>

        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-envelope text-secondary"></i>
            </span>

            <div class="form-floating flex-grow-1">
              <input
                type="email"
                class="form-control"
                id="inputEmail"
                placeholder="Email"
                required=""
              />
              <label for="inputEmail">Email</label>
            </div>
          </div>

          <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
        </div>

        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-lock text-secondary"></i>
            </span>

            <div class="form-floating flex-grow-1">
              <input
                type="password"
                class="form-control"
                id="inputPassword"
                placeholder="Mật khẩu"
                required=""
              />
              <label for="inputPassword">Mật khẩu</label>
            </div>
          </div>

          <div class="invalid-feedback">Vui lòng nhập mật khẩu.</div>
        </div>

        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-lock text-secondary"></i>
            </span>

            <div class="form-floating flex-grow-1">
              <input
                type="password"
                class="form-control"
                id="inputConfirmPassword"
                placeholder="Xác nhận mật khẩu"
                required=""
              />
              <label for="inputConfirmPassword">Xác nhận mật khẩu</label>
            </div>
          </div>

          <div class="invalid-feedback">Vui lòng nhập lại mật khẩu.</div>
        </div>

        <div class="col-8 mx-auto">
          <button type="submit" class="btn btn-outline-info w-100">
            Đăng ký
          </button>
        </div>

        <div class="text-center">
          <a href="./signin.html" class="text-decoration-none">
            Đã có tài khoản? Đăng nhập ngay
          </a>
        </div>
      </form>
    </div>

    <script src="./register.js"></script>
  </body>
</html>

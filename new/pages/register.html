<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.css"
      integrity="sha512-NhLySQDkiKSKnT+R795uaHWRQ7D3VuIvgeOLCK8cWq4w5fq4sWF90gj8eURpTqn/f1mFzqClpOz8JPlgVTLfFw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"
      integrity="sha512-K/oyQtMXpxI4+K0W7H25UopjM8pzq0yrVdFdG21Fh5dBe91I40pDd9A4lzNlHPHBIP2cwZuoxaUSX0GJSObvGA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link rel="stylesheet" href="../static/css/index.css" />
  </head>
  <body>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.js"
      integrity="sha512-aK6kibiwf8qo6euZqFOsx3sZ0WmEYs3f/wtvp44qy8CdGcTah45mgbOsLi5RMvylljL0TTMu6Shr6X+g1w1lIA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- Toast Success starts-->
    <div
      id="toastSuccess"
      class="toast align-items-center text-bg-success border-0 position-fixed top-0 start-50 translate-middle-x mt-3 z-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body" id="toastSuccessBody"></div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
        ></button>
      </div>
    </div>
    <!-- Toast Success ends-->

    <!-- Toast Danger starts-->
    <div
      id="toastDanger"
      class="toast align-items-center text-bg-danger border-0 position-fixed top-0 start-50 translate-middle-x mt-3 z-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body" id="toastDangerBody"></div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
        ></button>
      </div>
    </div>
    <!--Toast Danger ends-->

    <!--Register-form-content starts-->
    <div class="m-4">
      <form
        class="row g-3 needs-validation d-grid"
        id="formRegister"
        novalidate=""
      >
        <!--Username-input starts-->
        <div class="col-md-4 mx-auto">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-user text-secondary"></i>
            </span>

            <div class="form-floating flex-grow-1">
              <input
                type="text"
                class="form-control"
                id="inputName"
                placeholder="Username"
                required=""
              />
              <label for="inputName">Username</label>
            </div>
          </div>

          <div class="invalid-feedback">Please enter Username.</div>
        </div>
        <!--Username-input ends-->

        <!--Email-input starts-->
        <div class="col-md-4 mx-auto">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-envelope text-secondary"></i>
            </span>

            <div class="form-floating flex-grow-1">
              <input
                type="email"
                class="form-control"
                id="inputEmail"
                placeholder="Email"
                required=""
              />
              <label for="inputEmail">Email</label>
            </div>
          </div>
        </div>
        <!--Email-input ends-->

        <!--Password-input starts-->
        <div class="col-md-4 mx-auto">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-lock text-secondary"></i>
            </span>

            <div class="form-floating flex-grow-1">
              <input
                type="password"
                class="form-control"
                id="inputPassword"
                placeholder="Password"
                required=""
                new-password=""
              />
              <label for="inputPassword">Password</label>
            </div>
          </div>
        </div>
        <!--Password-input ends-->

        <!--Gender-input starts-->
        <div class="col-md-4 mx-auto">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-venus-mars text-secondary"></i>
            </span>
            <div class="form-floating flex-grow-1">
              <select class="form-select" id="inputGender" required="">
                <option value="" disabled selected>Choose gender...</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other...</option>
              </select>
              <label for="inputGender">Gender</label>
            </div>
          </div>
          <div class="invalid-feedback">Vui lòng choose giới tính.</div>
        </div>
        <!--Gender-input ends-->

        <!--DOB-input starts-->
        <div class="col-md-4 mx-auto">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-calendar-days text-secondary"></i>
            </span>
            <div class="form-floating flex-grow-1">
              <input
                type="text"
                class="form-control"
                id="inputDOB"
                placeholder="dd/mm/yyyy"
                required=""
              />
              <label for="inputDOB">Date Of birth</label>
            </div>
          </div>
          <div class="invalid-feedback">Please enter date of birth.</div>
        </div>
        <!--DOB-input ends-->

        <!--Submit-button starts-->
        <div class="d-grid gap-2 col-6 mx-auto">
          <button type="submit" class="btn btn-outline-primary">
            Register
          </button>
        </div>
        <!--Submit-button ends-->
      </form>

      <!--Signin-link starts-->
      <div class="text-center">
        <a href="./signin.html" class="text-decoration-none">
          Already have an account? Sign in!
        </a>
      </div>
      <!--Signin-link ends-->
    </div>
    <!--Register-form-content ends-->

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../static/js/register.js" type="module"></script>
  </body>
</html>
